      <text x="10" y="214" fill="#B45309" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Charaka Samhita</text>
      <text x="10" y="231" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Vimana Sthana Ch. 8 Rules</text>

