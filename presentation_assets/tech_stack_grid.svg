      <text x="10" y="150" fill="#B45309" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GIGW 3.0 &amp; WCAG AAA</text>
      <text x="10" y="167" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Accessible Indian Govt UI</text>

